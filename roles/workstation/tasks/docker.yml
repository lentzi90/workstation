# Clean up the legacy one-line-style repository and apt-key location from older
# runs, otherwise apt complains about conflicting Signed-By values.
- name: Remove legacy Docker apt repository and key
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
  - /etc/apt/sources.list.d/download_docker_com_linux_{{ distro }}.list
  - /etc/apt/trusted.gpg.d/docker.asc

- name: Add Docker Repository
  become: true
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/{{ distro }}
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: stable
    architectures: "{{ arch }}"
    signed_by: https://download.docker.com/linux/{{ distro }}/gpg
    state: present
  register: docker_repository

- name: Install docker
  become: true
  apt:
    name:
    - docker-ce
    - docker-ce-cli
    - containerd.io
    - docker-buildx-plugin
    update_cache: "{{ docker_repository is changed | bool }}"

- name: Adding user to docker group
  become: true
  user:
    name: "{{ ansible_facts['user_id'] }}"
    groups: docker
    append: true
