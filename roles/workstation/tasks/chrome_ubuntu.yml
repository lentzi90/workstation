# The google-chrome-stable package configures its own apt repository and signing
# key (/etc/apt/sources.list.d/google-chrome.sources), so it is only installed
# from the official .deb once. After that it is kept up to date through apt.
- name: "Check if Google chrome is installed"
  ansible.builtin.package_facts:
    manager: apt

- name: "Install Google chrome"
  when: "'google-chrome-stable' not in ansible_facts.packages"
  ansible.builtin.apt:
    deb: https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
    state: present
