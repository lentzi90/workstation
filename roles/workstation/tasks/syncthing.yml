- name: Check for syncthing systemd unit
  stat:
    path: /home/{{ ansible_facts["user_id"] }}/.config/systemd/user/syncthing.service
  register: syncthing_unit

- name: Stop and disable syncthing service
  when: syncthing_unit.stat.exists
  systemd:
    name: syncthing
    state: stopped
    enabled: false
    scope: user

- name: Remove systemd unit for syncthing
  file:
    path: /home/{{ ansible_facts["user_id"] }}/.config/systemd/user/syncthing.service
    state: absent

- name: Uninstall syncthing
  become: true
  file:
    path: /usr/local/bin/syncthing
    state: absent
