- name: Create AppImages directory if it does not exist
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/AppImages"
    state: directory

- name: Uninstall DevPod AppImage
  file:
    path: "{{ ansible_facts['user_dir'] }}/AppImages/devpod.appimage"
    state: absent

- name: Install Devsy AppImage
  get_url:
    url: https://github.com/devsy-org/devsy/releases/latest/download/Devsy_linux_x86_64.AppImage
    dest: "{{ ansible_facts['user_dir'] }}/AppImages/devsy.appimage"
    force: false

- name: Install OpenCloud AppImage
  get_url:
    url: https://github.com/opencloud-eu/desktop/releases/download/v2.0.0/OpenCloud_Desktop-v2.0.0-linux-gcc-x86_64.AppImage
    dest: "{{ ansible_facts['user_dir'] }}/AppImages/opencloud_desktop_desktop_sync_client.appimage"
    force: false
